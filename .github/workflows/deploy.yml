name: Deploy GymLog to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair and restore GymLog source
        run: |
          python3 - <<'PY'
          import base64, io, string, zipfile, zlib
          from pathlib import Path
          encoded = Path("source-files.zip.b64").read_text().strip()
          encoded = encoded[:12624] + encoded[12625:]
          alphabet = string.ascii_letters + string.digits + "+/"
          repaired = None
          for pos in range(len(encoded) + 1):
              prefix, suffix = encoded[:pos], encoded[pos:]
              for char in alphabet:
                  try:
                      data = base64.b64decode(prefix + char + suffix, validate=True)
                      if len(data) != 13286 or data[:4] != b"PK\x03\x04":
                          continue
                      crc = int.from_bytes(data[14:18], "little")
                      comp_size = int.from_bytes(data[18:22], "little")
                      name_len = int.from_bytes(data[26:28], "little")
                      extra_len = int.from_bytes(data[28:30], "little")
                      start = 30 + name_len + extra_len
                      raw = zlib.decompress(data[start:start+comp_size], -15)
                      if len(raw) != 32265 or zlib.crc32(raw) & 0xffffffff != crc:
                          continue
                      with zipfile.ZipFile(io.BytesIO(data)) as archive:
                          if archive.testzip() is None:
                              repaired = data
                              archive.extractall("/tmp/gymlog-source")
                              break
                  except Exception:
                      continue
              if repaired is not None:
                  print(f"Repaired source archive at Base64 offset {pos}.")
                  break
          if repaired is None:
              raise SystemExit("Could not repair GymLog source archive.")
          PY
          cp -R /tmp/gymlog-source/src/. src/
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build app
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
