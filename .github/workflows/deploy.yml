name: Deploy GymLog to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair and restore GymLog source
        run: |
          python3 - <<'PY'
          import base64, io, string, zipfile
          from pathlib import Path
          encoded = Path("source-files.zip.b64").read_text().strip()
          # The first transfer dropped one Base64 character near the CSS entry.
          # Reconstruct the missing character and validate both files by ZIP CRC.
          candidate_base = encoded[:12624] + encoded[12625:]
          alphabet = string.ascii_letters + string.digits + "+/"
          for char in alphabet:
              try:
                  data = base64.b64decode(candidate_base[:12624] + char + candidate_base[12624:], validate=True)
                  with zipfile.ZipFile(io.BytesIO(data)) as archive:
                      if archive.testzip() is None:
                          archive.extractall("/tmp/gymlog-source")
                          print("GymLog source archive repaired and verified.")
                          break
              except Exception:
                  continue
          else:
              raise SystemExit("Could not repair GymLog source archive.")
          PY
          cp -R /tmp/gymlog-source/src/. src/
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build app
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
